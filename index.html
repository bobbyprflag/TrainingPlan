<title>Summit Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#18212B; --muted:#5A6573; --line:#D6DCE3;
  --heat:#C9381F; --heat-soft:#FBE4DF; --pine:#2E6A4E; --pine-soft:#E0EEE6; --field:#F5F7F9;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --cond:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"Barlow",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151B; --surface:#19212A; --ink:#E7EBEF; --muted:#9AA5B1; --line:#2B3541;
    --heat:#FF6B55; --heat-soft:#3A201C; --pine:#62C493; --pine-soft:#183126; --field:#141B22;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151B; --surface:#19212A; --ink:#E7EBEF; --muted:#9AA5B1; --line:#2B3541;
  --heat:#FF6B55; --heat-soft:#3A201C; --pine:#62C493; --pine-soft:#183126; --field:#141B22;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
main{max-width:560px;margin:0 auto;padding:12px 16px 120px}
h1,h2,h3{font-family:var(--cond);font-weight:600;letter-spacing:.005em;margin:0;line-height:1.05}
h2{font-size:26px;margin:28px 0 10px}
h3{font-size:21px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}
a{color:var(--pine)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pine);outline-offset:2px;border-radius:6px}

.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 0 4px}
.top .date{font-family:var(--cond);font-size:20px;font-weight:600}
.sync{font-size:13px;color:var(--muted);text-align:right}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.panel.flat{background:transparent;border:none;padding:0}

/* Session hero: the one loud element */
.hero{position:relative;background:var(--surface);border-radius:18px;padding:18px 18px 16px;margin:10px 0 14px;border:1px solid var(--line);overflow:hidden}
.hero.heat{border-color:transparent;box-shadow:inset 0 0 0 2px var(--heat)}
.hero .when{font-size:15px;color:var(--muted);margin-bottom:2px}
.hero .name{font-family:var(--cond);font-weight:700;font-size:clamp(40px,12vw,60px);line-height:.92;letter-spacing:-.01em;margin:4px 0 10px}
.hero.heat .name{color:var(--heat)}
.hero .where{font-weight:500}
.hero .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

.btn{appearance:none;border:1px solid var(--line);background:var(--field);border-radius:999px;padding:10px 16px;min-height:44px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.done{background:var(--pine);border-color:var(--pine);color:#fff}
.btn.heat{background:var(--heat);border-color:var(--heat);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5}
.btn.sm{min-height:36px;padding:6px 12px;font-size:15px}

.note{border-left:3px solid var(--heat);background:var(--heat-soft);padding:10px 12px;border-radius:0 10px 10px 0;margin:10px 0;font-size:15px}
.note.good{border-color:var(--pine);background:var(--pine-soft)}

.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.field:first-of-type{border-top:none}
.field label,.field .lbl{font-weight:600}
.field .sub{display:block;font-weight:400;font-size:13px;color:var(--muted)}
input[type=number],input[type=text],input[type=date],input[type=time],select,textarea{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;font-size:17px}
input[type=number]{width:110px;text-align:right}
textarea{width:100%;min-height:70px}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--line);background:var(--field);border-radius:10px;min-width:44px;min-height:40px;padding:6px 10px;font-weight:600;cursor:pointer;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.meter{height:12px;background:var(--field);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:6px 0 4px}
.meter>span{display:block;height:100%;background:var(--pine);border-radius:999px;transition:width .3s}
.big{font-family:var(--cond);font-weight:700;font-size:34px;line-height:1}

.meal{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.meal:first-child{border-top:none}
.check{appearance:none;width:30px;height:30px;flex:0 0 30px;border-radius:9px;border:2px solid var(--line);background:var(--field);cursor:pointer;display:grid;place-items:center}
.check[aria-pressed="true"]{background:var(--pine);border-color:var(--pine)}
.check[aria-pressed="true"]::after{content:"";width:8px;height:14px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
.meal .info{flex:1;min-width:0}
.meal .slot{font-size:13px;color:var(--muted)}
.meal .mname{font-weight:600}
.meal .mac{font-size:13px;color:var(--muted);white-space:nowrap;text-align:right}

details{border-top:1px solid var(--line)}
details:first-child{border-top:none}
summary{list-style:none;cursor:pointer;padding:12px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:9px;height:9px;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(45deg);margin-right:4px;flex:0 0 auto;transition:transform .2s}
details[open]>summary::after{transform:rotate(-135deg)}
.dbody{padding:0 0 14px}
.dbody ul,.dbody ol{margin:6px 0 10px;padding-left:20px}
.dbody li{margin:3px 0}

.ex{padding:10px 0;border-top:1px dashed var(--line)}
.ex:first-child{border-top:none}
.ex .exn{font-weight:600}
.ex .rx{font-family:var(--cond);font-size:19px;font-weight:600}
.ex .loginp{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.ex .loginp input{width:150px;text-align:left}

.daygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0}
.daygrid .chip{min-width:0;padding:6px 0}

.tot{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.tot div{background:var(--field);border-radius:10px;padding:8px;text-align:center}
.tot b{display:block;font-family:var(--cond);font-size:22px}
.tot span{font-size:12px;color:var(--muted)}

.gitem{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.gitem:first-child{border-top:none}
.gitem .gname{flex:1;min-width:0;font-size:15px}
.gitem .gname.got{text-decoration:line-through;color:var(--muted)}
.gitem input{width:84px;min-height:38px;padding:6px 8px;font-size:15px}
.tag{display:inline-block;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:4px}

table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:6px 4px;border-top:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:13px}
.scroll{overflow-x:auto}

.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .dot{fill:var(--muted)}
.chart .avg{fill:none;stroke:var(--heat);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}

ol.steps{padding-left:22px}
ol.steps li{margin:6px 0}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:600}
nav.tabs a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current="page"]{color:var(--ink)}
nav.tabs a[aria-current="page"] svg{stroke:var(--heat)}

.gen-out{margin-top:12px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--heat);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>

<script>
/* ---------------- Plan content ---------------- */

function slotLabel(slot) { if (!S.settings.fastOn) return slot === "first" ? "Breakfast" : SLOTNAME[slot]; return `${fmtMin(mealTime(slot))}, ${SLOTNAME[slot].toLowerCase()}`; }
function orderedMeals(date) { const ms = mealsFor(date).slice(); return S.settings.fastOn ? ms.sort((a, b) => mealTime(a[0]) - mealTime(b[0])) : ms; }
const dur = m => { const h = Math.floor(m / 60), mm = m % 60; return h ? `${h} h ${mm} min` : `${mm} min`; };
function fastStatus() {
  const now = new Date(), n = now.getHours() * 60 + now.getMinutes();
  const { open, close, len } = fastWindow();
  if (n >= open && n < close) return { eating: true, left: close - n, pct: (n - open) / len };
  const since = n >= close ? n - close : n + 1440 - close;
  const until = n < open ? open - n : open + 1440 - n;
  return { eating: false, since, until, pct: since / (1440 - len) };
}
const nowHHMM = () => { const n = new Date(); return `${pad(n.getHours())}:${pad(n.getMinutes())}`; };
function windowLen(d) { if (!d.eatStart || !d.eatEnd) return null; const l = toMin(d.eatEnd) - toMin(d.eatStart); return l > 0 ? l : null; }
function windowKept(date) { const d = getDay(date); if (d.fastKept) return true; const l = windowLen(d); return l == null ? null : l <= (S.settings.fastHours || 8) * 60 + 15; }
function overnightFast(date) { const y = getDay(addDays(date, -1)), d = getDay(date); if (!y.eatEnd || !d.eatStart) return null; return 1440 - toMin(y.eatEnd) + toMin(d.eatStart); }
const bar = (pct, color) => `<div class="meter"><span style="width:${Math.round(Math.max(0, Math.min(1, pct)) * 100)}%${color ? `;background:${color}` : ""}"></span></div>`;
function fastCardInner() {
  const t = today(), d = getDay(t), y = getDay(addDays(t, -1));
  const L = (S.settings.fastHours || 8) * 60, F = 1440 - L;
  const n = new Date(), now = n.getHours() * 60 + n.getMinutes();
  const tip = "Water, black coffee, plain tea and zero-calorie electrolytes are fine.";
  if (d.eatStart && !d.eatEnd) {
    const s = toMin(d.eatStart), close = s + L, left = close - now;
    return `<div style="font-weight:600">Eating since ${fmtMin(s)}</div><div class="small muted">${left >= 0 ? `Close your window by ${fmtMin(close)}, ${dur(left)} left.` : `${dur(-left)} past your ${L / 60}-hour window.`} Tap “Now” on last bite when you’re done.</div>${bar((now - s) / L)}`;
  }
  if (d.eatEnd || (!d.eatStart && y.eatEnd)) {
    const end = d.eatEnd ? toMin(d.eatEnd) : toMin(y.eatEnd) - 1440;
    const since = now - end, ready = end + F;
    return `<div style="font-weight:600">Fasting, ${dur(Math.max(0, since))} in</div><div class="small muted">${since >= F ? `You’ve passed ${F / 60} hours. Eat whenever you’re ready.` : `${F / 60} hours at ${fmtMin(ready)}${ready >= 1440 ? " tomorrow" : ""}. ${tip}`}</div>${bar(since / F, "var(--heat)")}`;
  }
  const st = fastStatus(), w = fastWindow();
  return st.eating
    ? `<div style="font-weight:600">Planned window is open</div><div class="small muted">${fmtMin(w.open)} to ${fmtMin(w.close)}. Tap “Now” at your first bite to start your own timer.</div>${bar(st.pct)}`
    : `<div style="font-weight:600">Planned window opens at ${fmtMin(w.open)}</div><div class="small muted">In ${dur(st.until)}. ${tip}</div>${bar(st.pct, "var(--heat)")}`;
}
setInterval(() => { const el = document.getElementById("fastcard"); if (el) el.innerHTML = fastCardInner(); }, 60000);

    ${SLOTS.map(([slot, label, max]) => {

        .sort((a, b) => (P.picks[slot].includes(b) - P.picks[slot].includes(a)) || (vegScore(b) - vegScore(a)) || RECIPES[a].name.localeCompare(RECIPES[b].name));
      const names = P.picks[slot].map(id => RECIPES[id].short).join(", ");
      return `<details data-key="slot-${slot}"><summary><span><b>${label}: ${P.picks[slot].length} of ${max}</b><br><span class="small muted">${esc(names || "None picked yet")}</span></span></summary>
        <div class="dbody">${list.length ? list.map(rid => opt(slot, rid)).join("") : `<p class="small muted">No recipes match. Turn some ingredients back on in step 1.</p>`}</div></details>`;
    }).join("")}</section>`;

  const order = [1, 2, 3, 4, 5, 6, 0];

  const cnt = rid => all.filter(([, id]) => id === rid).length;

  const steps = ["Shop using the list below."];
  if (need.rice) steps.push(`Cook rice: about ${fmtAmt(Math.ceil(need.rice / 3 * 2) / 2)} cups dry makes the ${fmtAmt(Math.round(need.rice * 4) / 4)} cups cooked you need. Freeze what you won’t eat by Thursday.`);
  if (prepChx) steps.push(`Bake ${Math.round(prepChx)} oz of chicken breast at 425°F for 18–22 minutes, to 165°F inside. Slice and refrigerate for the week.`);
  const boil = cnt("seggs") * 2; if (boil) steps.push(`Hard-boil ${boil} eggs.`);
  weekIds.filter(id => RECIPES[id].batch).forEach(id => steps.push(RECIPES[id].batch));
  steps.push("Everything else cooks the night you eat it, in 20–30 minutes.");
  const prep = `<h2>Sunday prep</h2><section class="panel"><ol class="steps" style="margin:0">${steps.map(p => `<li>${esc(p)}</li>`).join("")}</ol></section>`;

  // Walmart list, built from the week
  const ids = Object.keys(need).filter(id => need[id] > 0);
  let checkout = 0, eaten = 0;
  ids.forEach(id => { const g = ING[id], pr = priceOf(id); eaten += need[id] * pr / g.pkg; if (!g.pantry) checkout += Math.max(1, Math.ceil(need[id] / g.pkg - 0.1)) * pr; });
  const row = id => {
    const g = ING[id], got = !!(S.groc2[id] && S.groc2[id].got), n = Math.max(1, Math.ceil(need[id] / g.pkg - 0.1));
    return `<div class="gitem"><button class="check" aria-pressed="${got}" aria-label="Got ${esc(g.name)}" data-action="got" data-id="${id}"></button>
      <div class="gname ${got ? "got" : ""}">${g.pantry ? "" : `${n} × `}${esc(g.name)}<span class="small muted" style="display:block">${esc(g.pkgName)}. Need ${esc(ingLine(id, need[id]))}.</span></div>
      <label class="sr" for="p-${id}">Price for ${esc(g.name)}</label><input type="number" id="p-${id}" inputmode="decimal" step="0.01" min="0" value="${priceOf(id).toFixed(2)}" data-price="${id}"></div>`;
  };
  const GORDER = [["protein", "Protein"], ["dairy", "Eggs and dairy"], ["carb", "Bread, pasta and beans"], ["veg", "Produce and frozen vegetables"], ["pantry", "Sauces, broth and cans"]];
  const groc = `<h2>Walmart list</h2><section class="panel">
    <div class="tot" style="grid-template-columns:repeat(3,1fr);margin-top:0"><div><b>${money(eaten)}</b><span>food you’ll eat</span></div><div><b>${money(checkout)}</b><span>at checkout</span></div><div><b>${money(st.budget)}</b><span>your budget</span></div></div>
    <p class="small muted" style="margin:10px 0">“Food you’ll eat” is what this week’s meals use. Checkout is whole packages, so it runs higher some weeks; the leftovers carry into the next. Prices are estimates: tap one to change it to what you paid.</p>
    ${GORDER.map(([g, label]) => { const list = ids.filter(id => ING[id].g === g && !ING[id].pantry); return list.length ? `<h3 style="margin:12px 0 2px">${label}</h3>` + list.map(row).join("") : ""; }).join("")}
    ${ids.some(id => ING[id].pantry) ? `<h3 style="margin:16px 0 2px">Pantry staples</h3><p class="small muted" style="margin:0 0 4px">These last several weeks, so they aren’t in the checkout total. Buy when you run out.</p>` + ids.filter(id => ING[id].pantry).map(row).join("") : ""}
    <div class="row" style="margin-top:12px"><button class="btn sm" data-action="clearlist">Uncheck everything for a new week</button></div></section>`;

  const rules = `<h2>Eating out or eating with the family</h2><section class="panel small">
    <p>Build the plate by hand: 2 palms of protein, 1–2 cupped hands of carbs, 2 fists of vegetables, 1 thumb of fat.</p>
    <p style="margin:0">Always ask about shellfish in sauces, stocks and shared fryers. Puerto Rican restaurants often cook with shrimp, so ask about the sofrito and rice too.</p></section>`;

  return targets + `<h2>Plan your week</h2>` + step1 + step2 + step3 + recipes + prep + groc + rules;
}

function vProgress() {
  const t = today();
  const days = allDays().filter(([, v]) => v.w);
  const start = addDays(t, -55);
  const pts = days.filter(([d]) => d >= start);
  let chart;
  if (pts.length < 2) {
    chart = `<p class="muted">Log your morning weight on the Today tab. Your trend line appears after a few days.</p>`;
  } else {
    const W = 340, H = 170, L = 34, R = 8, T = 10, B = 22;
    const ws = pts.map(([, v]) => +v.w);
    const lo = Math.floor(Math.min(...ws) - 1), hi = Math.ceil(Math.max(...ws) + 1);
    const t0 = parseDs(pts[0][0]).getTime(), t1 = Math.max(parseDs(pts[pts.length - 1][0]).getTime(), t0 + 86400000);
    const x = d => L + (parseDs(d).getTime() - t0) / (t1 - t0) * (W - L - R);
    const y = w => T + (hi - w) / (hi - lo) * (H - T - B);
    const avgPts = pts.map(([d]) => { const a = avgWeight(d); return a ? `${x(d).toFixed(1)},${y(a.avg).toFixed(1)}` : null; }).filter(Boolean).join(" ");
    const grid = [lo, (lo + hi) / 2, hi].map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 4}" y="${y(v) + 4}" text-anchor="end">${Math.round(v)}</text>`).join("");
    chart = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend over the last 8 weeks">${grid}
      ${pts.map(([d, v]) => `<circle class="dot" cx="${x(d).toFixed(1)}" cy="${y(+v.w).toFixed(1)}" r="2.6"/>`).join("")}
      <polyline class="avg" points="${avgPts}"/>
      <text x="${L}" y="${H - 4}">${fmtDate(pts[0][0])}</text><text x="${W - R}" y="${H - 4}" text-anchor="end">${fmtDate(pts[pts.length - 1][0])}</text></svg>
      <p class="small muted" style="margin:6px 0 0">Dots are daily weigh-ins. The line is your 7-day average, the number that matters. Heat sessions and salty meals move the dots; ignore them.</p>`;
  }

  // Weekly review
  const a1 = avgWeight(t), a0 = avgWeight(addDays(t, -7)), am1 = avgWeight(addDays(t, -14));
  let review;
  if (!a1 || !a0 || a1.n < 3 || a0.n < 3) {
    review = `<p class="muted">Weigh in at least 3 mornings a week for two weeks to unlock your weekly review.</p>`;
  } else {
    const delta = a1.avg - a0.avg, prev = am1 && am1.n >= 3 ? a0.avg - am1.avg : null;
    const ms = S.measures.slice().sort((p, q) => p.d < q.d ? -1 : 1);
    const waistDown = ms.length >= 2 && (ms[ms.length - 2].waist - ms[ms.length - 1].waist) >= 0.5;
    let msg, act = "";
    if (delta <= -1.75) { msg = `Down ${Math.abs(round1(delta))} lb this week, faster than planned. Losing this fast risks muscle.`; act = `<button class="btn sm heat" data-action="adjust" data-val="150">Add 150 calories (to ${(S.settings.kcal + 150).toLocaleString()})</button>`; }
    else if (delta <= -0.4) { msg = `Down ${Math.abs(round1(delta))} lb this week. Right on track. Change nothing.`; }
    else if (waistDown) { msg = `Weight is flat but your waist is down. That’s recomposition: losing fat while gaining muscle. Hold steady.`; }
    else if (prev != null && prev > -0.4) { msg = `Two flat weeks in a row. Time for a small change.`; act = `<button class="btn sm heat" data-action="adjust" data-val="-150">Drop 150 calories (to ${(S.settings.kcal - 150).toLocaleString()})</button>`; }
    else { msg = `Flat this week (${delta > 0 ? "+" : ""}${round1(delta)} lb). One flat week is usually water from heat, salt, or poor sleep. Hold steady and check next week.`; }
    review = `<p>${msg}</p>${act}`;
  }
  const mon = mondayOf(t);
  let sessions = 0, protDays = 0, daysSoFar = 0, fastDays = 0;
  for (let i = 0; i < 7; i++) { const d = addDays(mon, i); if (d > t) break; daysSoFar++; const v = getDay(d); if (v.done) sessions++; if (dayTotals(d).p >= S.settings.p - 10) protDays++; if (windowKept(d)) fastDays++; }

  // Measurements
  const h = S.settings.heightIn;
  const ms = S.measures.slice().sort((p, q) => p.d < q.d ? 1 : -1);
  const latest = ms[0];
  const lbf = latest ? navyBf(latest.waist, latest.neck, h) : null;
  const lw = latest ? (latest.w || (avgWeight(latest.d) || {}).avg) : null;
  const meas = `<section class="panel"><h3>Body fat estimate</h3>
    <p class="small muted">Every 2 weeks, same time of day. Tape around your waist at the belly button, relaxed, and around your neck just below the Adam’s apple. This uses the U.S. Navy formula: not perfect, but consistent, which is what matters.</p>
    <div class="field"><label for="m-waist">Waist, inches</label><input type="number" id="m-waist" inputmode="decimal" step="0.25"></div>
    <div class="field"><label for="m-neck">Neck, inches</label><input type="number" id="m-neck" inputmode="decimal" step="0.25"></div>
    <div class="row" style="margin:8px 0 12px"><button class="btn sm primary" data-action="addmeasure">Save measurement</button></div>
    ${lbf != null ? `<p><span class="big">${round1(lbf)}%</span> <span class="muted">estimated body fat, goal ${S.settings.goalBf}%${lw ? `. About ${Math.round(lw * (1 - lbf / 100))} lb lean mass` : ""}.</span></p>` : ""}
    ${ms.length ? `<div class="scroll"><table><thead><tr><th>Date</th><th>Waist</th><th>Neck</th><th>Body fat</th><th></th></tr></thead><tbody>${ms.map(m => { const bf = navyBf(m.waist, m.neck, h); return `<tr><td>${fmtDate(m.d)}</td><td>${m.waist}"</td><td>${m.neck}"</td><td>${bf != null ? round1(bf) + "%" : "—"}</td><td><button class="btn sm ghost" data-action="delmeasure" data-d="${m.d}" aria-label="Delete measurement from ${fmtDate(m.d)}">×</button></td></tr>`; }).join("")}</tbody></table></div>` : ""}
  </section>`;

  const tests = S.tests.slice().sort((p, q) => p.d < q.d ? 1 : -1);
  const testsPanel = `<section class="panel"><h3>Fitness check, every 6 weeks</h3>
    <p class="small muted">Do these fresh, at the start of a session.</p>
    <div class="field"><label for="t-pu">Push-ups<span class="sub">Max with good form</span></label><input type="number" id="t-pu" inputmode="numeric"></div>
    <div class="field"><label for="t-pl">Plank<span class="sub">Seconds</span></label><input type="number" id="t-pl" inputmode="numeric"></div>
    <div class="field"><label for="t-sq">Deep squat hold<span class="sub">Seconds, heels down</span></label><input type="number" id="t-sq" inputmode="numeric"></div>
    <div class="field"><label for="t-sr">Toe touch<span class="sub">Inches past toes (negative if short)</span></label><input type="number" id="t-sr" inputmode="decimal" step="0.5"></div>
    <div class="row" style="margin:8px 0"><button class="btn sm primary" data-action="addtest">Save results</button></div>
    ${tests.length ? `<div class="scroll"><table><thead><tr><th>Date</th><th>Push-ups</th><th>Plank</th><th>Squat</th><th>Toe touch</th></tr></thead><tbody>${tests.map(x => `<tr><td>${fmtDate(x.d)}</td><td>${x.pu ?? "—"}</td><td>${x.pl != null ? x.pl + "s" : "—"}</td><td>${x.sq != null ? x.sq + "s" : "—"}</td><td>${x.sr != null ? x.sr + '"' : "—"}</td></tr>`).join("")}</tbody></table></div>` : ""}
  </section>`;

  return `<h2>Weight trend</h2><section class="panel">${chart}</section>
    <h2>This week</h2><section class="panel"><div class="tot" style="grid-template-columns:repeat(${S.settings.fastOn ? 3 : 2},1fr);margin-top:0"><div><b>${sessions} of 4</b><span>sessions done</span></div><div><b>${protDays} of ${daysSoFar}</b><span>days protein hit</span></div>${S.settings.fastOn ? `<div><b>${fastDays} of ${daysSoFar}</b><span>windows kept</span></div>` : ""}</div>
      <div style="margin-top:12px">${review}</div></section>
    <h2>Measurements</h2>${meas}${testsPanel}`;
}

function vMore() {
  const st = S.settings;
  const num = (id, label, sub, val, step = 1) => `<div class="field"><label for="${id}">${label}${sub ? `<span class="sub">${sub}</span>` : ""}</label><input type="number" id="${id}" inputmode="decimal" step="${step}" value="${val}"></div>`;
  const fw = fastWindow(), fh = st.fastHours || 8;

      <p><b>Fasting decides when you eat, not how much.</b> Still hit your protein and get close to your calories. A short window makes it easy to under-eat, and under-eating is the fastest way to lose muscle along with fat.</p>

  return `${fastGuide}<h2>Supplements</h2><section class="panel">${SUPPS.map(s => `<details data-key="sup-${esc(s.name)}"><summary><span><b>${esc(s.name)}</b><br><span class="small muted">${esc(s.dose)}</span></span></summary><div class="dbody small">${esc(s.why)}</div></details>`).join("")}</section>
    <section class="panel"><h3>Skip these: shellfish allergy and blood pressure</h3><ul class="small" style="margin-bottom:0">${AVOID.map(a => `<li>${esc(a)}</li>`).join("")}</ul></section>

    <h2>Your numbers</h2><section class="panel">
      ${num("s-kcal", "Calories", "Daily target", st.kcal, 50)}
      ${num("s-p", "Protein, g", "", st.p, 5)}
      ${num("s-f", "Fat, g", "", st.f, 5)}
      ${num("s-c", "Carbs, g", "", st.c, 5)}
      ${num("s-budget", "Food budget, $ per week", "Your share", st.budget, 1)}
      ${num("s-height", "Height, inches", "Used for body fat", st.heightIn, 0.5)}

        <option value="8" ${st.fastOn && st.fastHours == 8 ? "selected" : ""}>16:8, 8-hour window</option>
        <option value="10" ${st.fastOn && st.fastHours == 10 ? "selected" : ""}>14:10, 10-hour window</option>
        <option value="0" ${!st.fastOn ? "selected" : ""}>Off</option></select></div>
      <div class="field"><label for="s-open">Window opens<span class="sub">Same time every day</span></label><input type="time" id="s-open" value="${st.fastOpen}"></div>

        <option value="auto" ${st.phase === "auto" ? "selected" : ""}>Automatic by date</option>

      <div class="row" style="margin-top:10px"><button class="btn primary" data-action="savesettings">Save numbers</button></div>
    </section>

    <h2>Why these numbers</h2><section class="panel small">
      <p>At 6′4″, 230 lb and about 24% body fat, you carry roughly 175 lb of lean mass. Your estimated maintenance is about 2,900–3,000 calories with 4–5 sessions a week, so 2,450 creates a steady deficit of about 1 lb a week.</p>
      <p>Protein at 200 g (about 1 g per pound of goal weight) is high enough to build muscle while losing fat. Keeping all your lean mass, 15% lands near 205 lb; with the muscle you’ll add, expect to finish around 208–212 lb.</p>

    </section>

    <h2>Your data</h2><section class="panel small">
      <p>Everything you log stays on this phone. Nothing is sent anywhere.</p>
      <p>Because of that, back up every couple of weeks: tap the button, then “Save to Files.” If you ever get a new phone, open the app there and restore the file.</p>
      <p class="muted">${S.settings.lastBackup ? `Last backup: ${fmtDate(S.settings.lastBackup)}.` : "No backup yet."}</p>
      <div class="row" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm primary" data-action="export">Back up my data</button><button class="btn sm" data-action="restore">Restore from a backup</button></div>
      <input type="file" id="restore-file" accept="application/json,.json" hidden>
      <p class="muted" style="margin-top:10px">This plan is general fitness and nutrition guidance, not medical advice. Check with your doctor or a registered dietitian about anything specific to your health and medications.</p>
    </section>`;
}

/* ---------------- Events ---------------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-action],[data-set]");
  if (!b) return;
  const t = today();
  if (b.dataset.set) { const k = b.dataset.set, v = +b.dataset.val; const d = getDay(t); setDay(t, { [k]: d[k] === v ? null : v }); render(); return; }
  const a = b.dataset.action;
  switch (a) {
    case "done": { const d = getDay(t); setDay(t, { done: d.done === b.dataset.sid ? null : b.dataset.sid }); render(); break; }
    case "swap": setDay(t, { swap: b.dataset.sid }); render(); break;
    case "unswap": setDay(t, { swap: null }); render(); break;
    case "stamp": setDay(t, { [b.dataset.k]: nowHHMM() }); render(); break;
    case "water": { const d = getDay(t); setDay(t, { water: Math.max(0, (d.water || 0) + +b.dataset.val) }); render(); break; }
    case "meal": { const d = getDay(t); const m = { ...(d.meals || {}) }; m[b.dataset.id] = !m[b.dataset.id]; const patch = { meals: m }; if (m[b.dataset.id] && S.settings.fastOn && !d.eatStart) patch.eatStart = nowHHMM(); setDay(t, patch); render(); break; }
    case "extra": { const d = getDay(t); const v = +b.dataset.val; setDay(t, { extraP: v === 0 ? 0 : (d.extraP || 0) + v }); render(); break; }
    case "opensession": e.preventDefault(); openSet.add("s-" + b.dataset.sid); go("train", "s-" + b.dataset.sid); break;
    case "openrecipe": e.preventDefault(); openSet.add("r-" + b.dataset.id); go("eat", "r-" + b.dataset.id); break;
    case "got": { const id = b.dataset.id; S.groc2[id] = { ...(S.groc2[id] || {}), got: !(S.groc2[id] && S.groc2[id].got) }; persist("profile"); render(); break; }
    case "clearlist": Object.keys(S.groc2).forEach(id => { S.groc2[id] = { ...S.groc2[id], got: false }; }); persist("profile"); render(); break;
    case "ing": { const P = plan(), id = b.dataset.id; if (P.off[id]) delete P.off[id]; else P.off[id] = true; PLANMSG = ""; persist("profile"); render(); break; }
    case "flav": { const P = plan(); P.flav[b.dataset.id] = !P.flav[b.dataset.id]; PLANMSG = ""; persist("profile"); render(); break; }
    case "pick": {
      const P = plan(), slot = b.dataset.slot, id = b.dataset.id, arr = P.picks[slot], def = SLOTS.find(x => x[0] === slot);
      if (arr.includes(id)) { P.picks[slot] = arr.filter(x => x !== id); Object.values(P.over).forEach(o => { if (o[slot] === id) delete o[slot]; }); PLANMSG = ""; }
      else if (arr.length >= def[2]) PLANMSG = `You can pick up to ${def[2]} ${def[1].toLowerCase()}. Remove one first.`;
      else { arr.push(id); PLANMSG = ""; }
      persist("profile"); render(); break;
    }
    case "resetweek": plan().over = {}; persist("profile"); render(); break;
    case "adjust": { const v = +b.dataset.val; S.settings.kcal += v; S.settings.c = Math.max(100, S.settings.c + Math.round(v / 4)); persist("profile"); render(); break; }
    case "addmeasure": {
      const waist = parseFloat($("#m-waist").value), neck = parseFloat($("#m-neck").value);
      if (!(waist > 20 && neck > 10)) { alert("Enter both waist and neck in inches."); return; }
      const w = getDay(t).w || null;
      S.measures = S.measures.filter(m => m.d !== t).concat([{ d: t, waist, neck, w }]);
      persist("profile"); render(); break;
    }
    case "delmeasure": S.measures = S.measures.filter(m => m.d !== b.dataset.d); persist("profile"); render(); break;
    case "addtest": {
      const val = id => { const v = $(id).value; return v === "" ? null : +v; };
      const rec = { d: t, pu: val("#t-pu"), pl: val("#t-pl"), sq: val("#t-sq"), sr: val("#t-sr") };
      if ([rec.pu, rec.pl, rec.sq, rec.sr].every(v => v == null)) return;
      S.tests = S.tests.filter(x => x.d !== t).concat([rec]); persist("profile"); render(); break;
    }
    case "savesettings": {
      const n = (id, k) => { const v = parseFloat($(id).value); if (!isNaN(v) && v > 0) S.settings[k] = v; };
      n("#s-kcal", "kcal"); n("#s-p", "p"); n("#s-f", "f"); n("#s-c", "c"); n("#s-budget", "budget"); n("#s-height", "heightIn"); n("#s-goal", "goalBf");
      const ce = $("#s-crunch").value; if (ce) S.settings.crunchEnd = ce;
      S.settings.phase = $("#s-phase").value;
      const fv = +$("#s-fast").value; S.settings.fastOn = fv > 0; if (fv > 0) S.settings.fastHours = fv;
      const op = $("#s-open").value;
      if (op) { if (toMin(op) + (S.settings.fastHours || 8) * 60 <= 1440) S.settings.fastOpen = op; else alert("Your eating window has to close by midnight. Pick an earlier opening time."); }
      persist("profile"); render();
      b.textContent = "Saved"; break;
    }
    case "export": {
      const name = `summit-backup-${t}.json`;
      const file = new File([JSON.stringify(S, null, 2)], name, { type: "application/json" });
      S.settings.lastBackup = t; saveLocal();
      if (navigator.canShare && navigator.canShare({ files: [file] })) navigator.share({ files: [file], title: "Summit backup" }).catch(() => {});
      else { const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
      render(); break;
    }
    case "restore": { const f = document.getElementById("restore-file"); if (f) f.click(); break; }
  }
});

document.addEventListener("change", e => {
  const el = e.target, t = today();
  if (el.id === "restore-file") {
    const f = el.files && el.files[0]; if (!f) return;
    f.text().then(txt => {
      const o = JSON.parse(txt);
      if (!o || typeof o !== "object" || !(o.settings || o.logs)) throw new Error("bad");
      if (!confirm("Replace the data on this phone with this backup?")) return;
      S = { settings: normSettings(o.settings), grocery: o.grocery || {}, groc2: o.groc2 || {}, plan: o.plan || null, measures: o.measures || [], tests: o.tests || [], saved: o.saved || [], logs: o.logs || {} }; plan();
      saveLocal(); render(); alert("Backup restored.");
    }).catch(() => alert("That file isn’t a Summit backup. Choose the .json file you saved from this app."));
    el.value = ""; return;
  }
  if (el.dataset.ftime) { setDay(t, { [el.dataset.ftime]: el.value || null }); pendingRender = true; return; }
  if (el.dataset.field === "w") { const v = parseFloat(el.value); setDay(t, { w: isNaN(v) ? null : round1(v) }); }
  else if (el.dataset.lift) { const d = getDay(t); const l = { ...(d.lifts || {}) }; const v = el.value.trim().slice(0, 40); if (v) l[el.dataset.lift] = v; else delete l[el.dataset.lift]; setDay(t, { lifts: l }); }
  else if (el.dataset.price) { const v = parseFloat(el.value); const id = el.dataset.price; S.groc2[id] = { ...(S.groc2[id] || {}), price: isNaN(v) ? null : v }; persist("profile"); pendingRender = true; }
  else if (el.dataset.over) {
    const [wd, slot] = el.dataset.over.split("|"), P = plan(), arr = P.picks[slot], def = arr[((+wd + 6) % 7) % arr.length];
    const o = { ...(P.over[wd] || {}) };
    if (el.value === def) delete o[slot]; else o[slot] = el.value;
    if (Object.keys(o).length) P.over[wd] = o; else delete P.over[wd];
    persist("profile"); render();
  }
});

document.addEventListener("toggle", e => {
  const d = e.target;
  if (d.tagName === "DETAILS" && d.dataset.key) {
    if (d.open) openSet.add(d.dataset.key); else openSet.delete(d.dataset.key);
    if (d.open && d.dataset.lazy) { const body = d.querySelector(".dbody"); if (body && !body.innerHTML.trim()) safeRender(); }
  }
}, true);

/* ---------------- Routing ---------------- */
const VALID = TABS.map(x => x[0]);
function go(name, anchor) {
  tab = name;
  if (location.hash !== "#" + name) history.replaceState(null, "", "#" + name);
  render();
  if (anchor) { const el = document.getElementById(anchor); if (el) el.scrollIntoView({ block: "start", behavior: "smooth" }); }
  else window.scrollTo(0, 0);
}
function fromHash() { const h = location.hash.slice(1); tab = VALID.includes(h) ? h : "today"; render(); window.scrollTo(0, 0); }
window.addEventListener("hashchange", fromHash);
fromHash();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
</script>
