<title>Summit Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#18212B; --muted:#5A6573; --line:#D6DCE3;
  --heat:#C9381F; --heat-soft:#FBE4DF; --pine:#2E6A4E; --pine-soft:#E0EEE6; --field:#F5F7F9;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --cond:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"Barlow",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151B; --surface:#19212A; --ink:#E7EBEF; --muted:#9AA5B1; --line:#2B3541;
    --heat:#FF6B55; --heat-soft:#3A201C; --pine:#62C493; --pine-soft:#183126; --field:#141B22;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151B; --surface:#19212A; --ink:#E7EBEF; --muted:#9AA5B1; --line:#2B3541;
  --heat:#FF6B55; --heat-soft:#3A201C; --pine:#62C493; --pine-soft:#183126; --field:#141B22;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
main{max-width:560px;margin:0 auto;padding:12px 16px 120px}
h1,h2,h3{font-family:var(--cond);font-weight:600;letter-spacing:.005em;margin:0;line-height:1.05}
h2{font-size:26px;margin:28px 0 10px}
h3{font-size:21px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}
a{color:var(--pine)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pine);outline-offset:2px;border-radius:6px}

.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 0 4px}
.top .date{font-family:var(--cond);font-size:20px;font-weight:600}
.sync{font-size:13px;color:var(--muted);text-align:right}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.panel.flat{background:transparent;border:none;padding:0}

/* Session hero: the one loud element */
.hero{position:relative;background:var(--surface);border-radius:18px;padding:18px 18px 16px;margin:10px 0 14px;border:1px solid var(--line);overflow:hidden}
.hero.heat{border-color:transparent;box-shadow:inset 0 0 0 2px var(--heat)}
.hero .when{font-size:15px;color:var(--muted);margin-bottom:2px}
.hero .name{font-family:var(--cond);font-weight:700;font-size:clamp(40px,12vw,60px);line-height:.92;letter-spacing:-.01em;margin:4px 0 10px}
.hero.heat .name{color:var(--heat)}
.hero .where{font-weight:500}
.hero .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

.btn{appearance:none;border:1px solid var(--line);background:var(--field);border-radius:999px;padding:10px 16px;min-height:44px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.done{background:var(--pine);border-color:var(--pine);color:#fff}
.btn.heat{background:var(--heat);border-color:var(--heat);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5}
.btn.sm{min-height:36px;padding:6px 12px;font-size:15px}

.note{border-left:3px solid var(--heat);background:var(--heat-soft);padding:10px 12px;border-radius:0 10px 10px 0;margin:10px 0;font-size:15px}
.note.good{border-color:var(--pine);background:var(--pine-soft)}

.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.field:first-of-type{border-top:none}
.field label,.field .lbl{font-weight:600}
.field .sub{display:block;font-weight:400;font-size:13px;color:var(--muted)}
input[type=number],input[type=text],input[type=date],input[type=time],select,textarea{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;font-size:17px}
input[type=number]{width:110px;text-align:right}
textarea{width:100%;min-height:70px}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--line);background:var(--field);border-radius:10px;min-width:44px;min-height:40px;padding:6px 10px;font-weight:600;cursor:pointer;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.meter{height:12px;background:var(--field);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:6px 0 4px}
.meter>span{display:block;height:100%;background:var(--pine);border-radius:999px;transition:width .3s}
.big{font-family:var(--cond);font-weight:700;font-size:34px;line-height:1}

.meal{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.meal:first-child{border-top:none}
.check{appearance:none;width:30px;height:30px;flex:0 0 30px;border-radius:9px;border:2px solid var(--line);background:var(--field);cursor:pointer;display:grid;place-items:center}
.check[aria-pressed="true"]{background:var(--pine);border-color:var(--pine)}
.check[aria-pressed="true"]::after{content:"";width:8px;height:14px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
.meal .info{flex:1;min-width:0}
.meal .slot{font-size:13px;color:var(--muted)}
.meal .mname{font-weight:600}
.meal .mac{font-size:13px;color:var(--muted);white-space:nowrap;text-align:right}

details{border-top:1px solid var(--line)}
details:first-child{border-top:none}
summary{list-style:none;cursor:pointer;padding:12px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:9px;height:9px;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(45deg);margin-right:4px;flex:0 0 auto;transition:transform .2s}
details[open]>summary::after{transform:rotate(-135deg)}
.dbody{padding:0 0 14px}
.dbody ul,.dbody ol{margin:6px 0 10px;padding-left:20px}
.dbody li{margin:3px 0}

.ex{padding:10px 0;border-top:1px dashed var(--line)}
.ex:first-child{border-top:none}
.ex .exn{font-weight:600}
.ex .rx{font-family:var(--cond);font-size:19px;font-weight:600}
.ex .loginp{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.ex .loginp input{width:150px;text-align:left}

.daygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0}
.daygrid .chip{min-width:0;padding:6px 0}

.tot{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.tot div{background:var(--field);border-radius:10px;padding:8px;text-align:center}
.tot b{display:block;font-family:var(--cond);font-size:22px}
.tot span{font-size:12px;color:var(--muted)}

.gitem{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.gitem:first-child{border-top:none}
.gitem .gname{flex:1;min-width:0;font-size:15px}
.gitem .gname.got{text-decoration:line-through;color:var(--muted)}
.gitem input{width:84px;min-height:38px;padding:6px 8px;font-size:15px}
.tag{display:inline-block;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:4px}

table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:6px 4px;border-top:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:13px}
.scroll{overflow-x:auto}

.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .dot{fill:var(--muted)}
.chart .avg{fill:none;stroke:var(--heat);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}

ol.steps{padding-left:22px}
ol.steps li{margin:6px 0}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:600}
nav.tabs a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current="page"]{color:var(--ink)}
nav.tabs a[aria-current="page"] svg{stroke:var(--heat)}

.gen-out{margin-top:12px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--heat);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:root{--iron:#2F5D8A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--iron:#7DAEDF}}
:root[data-theme="dark"]{--iron:#7DAEDF}
body.lock{overflow:hidden}
.top .morelink{font-weight:600;font-size:15px;color:var(--muted);text-decoration:none;padding:6px 10px;border:1px solid var(--line);border-radius:999px}
.top .morelink[aria-current="page"]{color:var(--ink);border-color:var(--ink)}
.hero{box-shadow:inset 0 5px 0 var(--k,var(--line))}
.hero .when{color:var(--k,var(--muted));font-weight:600}
.linkbtn{appearance:none;background:none;border:none;padding:0;margin:0;color:inherit;text-align:left;cursor:pointer;font:inherit}
.linkbtn.mname{font-weight:600;display:block}
button.linkbtn:not(.mname):not(.rname){color:var(--pine);text-decoration:underline}
.check.ghost{display:inline-block;border-style:dashed;background:transparent;cursor:default}
.check.ghost.on{border-style:solid;border-color:var(--pine)}
.sub3{font-size:18px;margin:16px 0 4px}
ul.plain{list-style:none;padding:0;margin:6px 0}
ul.plain li{margin:3px 0}
.search{width:100%}
input[type=search]{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;font-size:17px;-webkit-appearance:none}

.weeknav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 10px}
.weeknav>div{text-align:center;display:flex;flex-direction:column}
.weeknav b{font-family:var(--cond);font-size:22px;font-weight:600}
.weeknav .btn{min-width:44px;font-size:22px;line-height:1}

.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 4px 8px}
.sday{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--ink);border-radius:12px;padding:4px 0}
.sday.today{background:var(--field)}
.sday .sl{font-size:12px;font-weight:600;color:var(--muted)}
.sday .sn{font-family:var(--cond);font-size:17px;font-weight:600}
.ringwrap{position:relative;width:42px;height:42px}
.ringwrap svg{display:block}
.rdot{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;box-sizing:border-box}
.legend .rdot{position:relative;display:inline-block;left:auto;top:auto;margin:0 2px 0 8px;vertical-align:-1px}
.rdot.done{background:var(--k)}
.rdot.plan{border:2px solid var(--k)}
.rdot.miss{border:2px dashed var(--muted)}
.rdot.rest{width:10px;height:3px;margin:-1.5px 0 0 -5px;border-radius:2px;background:var(--line)}
.legend{margin:6px 2px 0}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;gap:1px}
.tile b{font-family:var(--cond);font-size:28px;font-weight:700;line-height:1}
.tile b small{font-size:16px;color:var(--muted);font-weight:600}
.tile span{font-size:13px;font-weight:600}
.tile em{font-style:normal;font-size:11px;color:var(--muted)}

.daylist{padding:4px 12px}
.daycard>summary{padding:10px 0}
.daycard.today .dcd b{color:var(--heat)}
.dc{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;width:100%}
.dcd{display:flex;flex-direction:column;align-items:center;line-height:1.05}
.dcd b{font-size:14px}
.dcd span{font-family:var(--cond);font-size:24px;font-weight:700}
.dcm{min-width:0}
.dck{text-align:right;line-height:1}
.dck b{font-family:var(--cond);font-size:24px;display:block}
.dck span{font-size:12px;color:var(--muted)}
.pill{display:flex;align-items:center;gap:6px;font-weight:600;font-size:15px;margin-bottom:5px;flex-wrap:wrap}
.pill i{width:10px;height:10px;border-radius:50%;background:var(--k);flex:0 0 auto}
.pill em{font-style:normal;font-weight:500;font-size:12px;color:var(--muted)}
.mbars{display:flex;flex-direction:column;gap:3px}
.mb{display:grid;grid-template-columns:12px 1fr 34px;gap:6px;align-items:center;font-size:11px}
.mb span{color:var(--muted);font-weight:600}
.mb b{font-weight:600;text-align:right}
.mtrack{height:6px;background:var(--field);border-radius:4px;overflow:hidden}
.mtrack i{display:block;height:100%;border-radius:4px}
.ntable td,.ntable th{text-align:right}
.ntable th:first-child,.ntable tbody th,.ntable tfoot th{text-align:left}
.ntable td.hit{color:var(--pine);font-weight:700}
.ntable tfoot th,.ntable tfoot td{font-weight:600}

.cal{padding:6px 10px}
.calrow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 0 10px 8px;border-top:1px solid var(--line);box-shadow:inset 4px 0 0 var(--k)}
.calrow:first-child{border-top:none}
.calrow.today{background:var(--field);border-radius:10px}
.calbody{appearance:none;background:none;border:none;text-align:left;padding:2px 0;cursor:pointer;display:flex;flex-direction:column;gap:1px;font:inherit;color:inherit;min-width:0}
.cname{font-weight:600}
.st{font-size:12px;font-weight:700}
.st.done{color:var(--pine)}.st.today{color:var(--heat)}.st.miss{color:var(--muted)}

.rrow,.mrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.rrow:first-of-type,.mrow:first-of-type{border-top:none}
.rname{flex:1;min-width:0;display:flex;flex-direction:column}
.star{color:var(--heat)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper b{min-width:20px;text-align:center;font-family:var(--cond);font-size:20px}

.dayplan{padding:10px 0;border-top:1px solid var(--line)}
.dayplan:first-of-type{border-top:none}
.dayplan.today .dph b{color:var(--heat)}
.dph{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:6px}
.slotchips{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.slotchip{appearance:none;border:1px dashed var(--line);background:transparent;border-radius:10px;padding:5px 4px;min-height:52px;font:inherit;font-size:12px;line-height:1.2;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.slotchip span{font-size:10px;text-transform:none;font-weight:600;color:var(--muted)}
.slotchip.set{border-style:solid;background:var(--field);color:var(--ink);font-weight:600}
.slotchip.ate{border-color:var(--pine);box-shadow:inset 0 -3px 0 var(--pine)}

.addform{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.addform input[type=text]{width:100%}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.grid4 label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.grid4 input[type=number]{width:100%;text-align:left}
.row{display:flex;gap:8px;flex-wrap:wrap}

#ov{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px)}
.ovhead{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);max-width:560px;margin:0 auto}
.ovt{flex:1;min-width:0}
.ovt h2{margin:0;font-size:24px}
.ovbody{max-width:560px;margin:0 auto;padding:12px 16px 140px}
.ovfoot{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:8px;justify-content:center;z-index:3}
.ovfoot .btn.primary{flex:1;max-width:420px}
.pickrow{appearance:none;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0;display:grid;grid-template-columns:1fr auto;column-gap:10px;font:inherit;color:inherit;cursor:pointer}
.pickrow b{grid-column:1}
.pickrow span{grid-column:1}
.pickrow em{grid-column:2;grid-row:1 / span 2;align-self:center;font-style:normal;font-weight:700;font-size:13px;color:var(--pine)}
.pickrow em.zero{color:var(--muted)}
.pickrow.cur{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.kdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--k);margin-right:6px}

.exlog{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.exh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.exh .rx{font-family:var(--cond);font-size:17px;font-weight:600;color:var(--muted)}
.setrow{display:grid;grid-template-columns:26px 1fr 76px 60px 34px;gap:8px;align-items:center;padding:5px 4px;border-radius:8px;margin-top:4px}
.setrow.head{font-size:12px;color:var(--muted);font-weight:600;padding-top:8px}
.setrow.ok{background:var(--pine-soft)}
.setrow .sn{font-weight:700;text-align:center}
.setrow .prev{font-size:14px;color:var(--muted)}
.setrow input{width:100%;min-height:40px;padding:6px 8px;text-align:center}
.setrow .check{width:32px;height:32px}
.hint{font-size:14px;color:var(--pine);font-weight:600;margin:6px 0 2px}
.restbar{width:100%;display:flex;align-items:center;gap:10px;font-size:15px}
.restbar b{font-family:var(--cond);font-size:22px}
.rtrack{flex:1;height:8px;background:var(--field);border-radius:5px;overflow:hidden}
.rtrack i{display:block;height:100%;background:var(--heat)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;font-weight:600;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.18)}
</style>
</head>

    <div class="small muted" style="margin-bottom:4px">${tot.k.toLocaleString()} of ${st.kcal.toLocaleString()} calories, ${tot.f} g fat, ${tot.c} g carbs. Tap a meal’s box when you eat it.</div>
    ${mealRows(t)}
    <h3 style="margin:14px 0 2px">Anything else</h3>${extrasBlock(t)}</section>`;

  const lb = st.lastBackup;

    ? `<div class="note small">Your data lives only on this phone. <a href="#more">Back it up</a> so you don’t lose it.</div>` : "";
  return hero + fast + fuel + checkin + remind;
}

/* ---------- Week dashboard ---------- */
function vWeek() {
  const ws = curWs(), t = today(), st = S.settings;
  const days = [...Array(7)].map((_, i) => addDays(ws, i));
  const info = days.map(date => {
    const d = getDay(date), sid = plannedSession(date), m = sessMeta(d.done && d.done !== sid ? d.done : sid), tot = dayTotals(date);
    return { date, d, sid, m, tot, done: !!d.done, past: date < t, isToday: date === t, logged: tot.n > 0 };
  });
  // Strip of rings
  const strip = `<div class="strip">${info.map(x => {
    const dotCls = x.m.kind === "rest" ? "rest" : x.done ? "done" : x.m.optional && x.past ? "rest" : (x.past ? "miss" : "plan");
    return `<a class="sday ${x.isToday ? "today" : ""}" href="#day-${x.date}" data-action="jumpday" data-date="${x.date}">
      <span class="sl">${DAYNAMES[parseDs(x.date).getDay()][0]}</span>
      <span class="ringwrap">${ring(x.tot.k / st.kcal, 42, 5, calColor(x.tot.k))}<span class="rdot ${dotCls}" style="--k:${KIND[x.m.kind].color}"></span></span>
      <span class="sn">${parseDs(x.date).getDate()}</span></a>`;
  }).join("")}</div>
  <p class="small muted legend"><span class="rdot done" style="--k:var(--iron)"></span> done <span class="rdot plan" style="--k:var(--iron)"></span> planned <span class="rdot miss"></span> missed. Rings fill with calories.</p>`;

  // Tiles
  const planned = info.filter(x => x.sid !== "rest" && sessMeta(x.sid).kind !== "rest" && !sessMeta(x.sid).optional);
  const doneN = info.filter(x => x.done).length;
  const logged = info.filter(x => x.logged && x.date <= t);
  const avgK = logged.length ? Math.round(logged.reduce((a, x) => a + x.tot.k, 0) / logged.length) : null;
  const avgP = logged.length ? Math.round(logged.reduce((a, x) => a + x.tot.p, 0) / logged.length) : null;
  const protHit = logged.filter(x => x.tot.p >= st.p - 10).length;
  const fastDays = info.filter(x => windowKept(x.date) !== null);
  const fastKept = fastDays.filter(x => windowKept(x.date)).length;
  const endW = avgWeight(ws > t ? t : addDays(ws, 6) > t ? t : addDays(ws, 6)), prevW = avgWeight(addDays(ws, -1));
  const wDelta = endW && prevW && endW.n >= 2 && prevW.n >= 2 ? round1(endW.avg - prevW.avg) : null;
  const tile = (big, label, sub, color) => `<div class="tile"><b style="${color ? `color:${color}` : ""}">${big}</b><span>${label}</span>${sub ? `<em>${sub}</em>` : ""}</div>`;
  const tiles = `<div class="tiles">
    ${tile(`${doneN}<small>/${planned.length}</small>`, "workouts", "")}
    ${tile(avgK != null ? avgK.toLocaleString() : "—", "avg calories", `target ${st.kcal.toLocaleString()}`)}
    ${tile(avgP != null ? `${avgP}<small> g</small>` : "—", "avg protein", `target ${st.p} g`)}
    ${tile(`${protHit}<small>/${logged.length}</small>`, "protein days", "")}
    ${st.fastOn ? tile(`${fastKept}<small>/${fastDays.length}</small>`, "fasts kept", "") : ""}
    ${tile(wDelta != null ? `${wDelta > 0 ? "+" : ""}${wDelta}<small> lb</small>` : "—", "weight trend", "7-day average", wDelta != null ? (wDelta <= 0 ? "var(--pine)" : "var(--heat)") : "")}
  </div>`;

  // Day cards
  const mbar = (v, target, label, color) => `<div class="mb"><span>${label}</span><div class="mtrack"><i style="width:${Math.min(100, (v / target) * 100)}%;background:${color}"></i></div><b>${v}</b></div>`;
  const cards = info.map(x => {
    const wd = parseDs(x.date).getDay(), k = KIND[x.m.kind];
    const status = x.m.kind === "rest" ? "Rest" : x.done ? "Done ✓" : x.isToday ? "Today" : x.past ? (x.m.optional ? "Skipped" : "Missed") : x.m.optional ? "Optional" : "Planned";
    const wl = x.d.wlog, stt = wl ? wlogStats(wl) : null;
    const meals = MEALSLOTS.filter(s => (x.d.slots || {})[s]).map(s => { const r = R(x.d.slots[s]); return r ? `<li>${(x.d.eaten || {})[s] ? "✓" : "○"} ${esc(r.short || r.name)} <span class="muted">${r.kcal} cal, ${r.p} g</span></li>` : ""; }).join("")
      + (x.d.extras || []).map(e => `<li>✓ ${esc(e.name || "Other food")} <span class="muted">${e.k} cal, ${e.p} g</span></li>`).join("");
    const kept = windowKept(x.date);
    return `<details class="daycard ${x.isToday ? "today" : ""}" data-key="day-${x.date}" id="day-${x.date}">
      <summary><div class="dc">
        <div class="dcd"><b>${DAYNAMES[wd].slice(0, 3)}</b><span>${parseDs(x.date).getDate()}</span></div>
        <div class="dcm"><div class="pill" style="--k:${k.color}"><i></i>${esc(x.m.name)}<em>${status}</em></div>
          ${x.logged ? `<div class="mbars">${mbar(x.tot.p, st.p, "P", "var(--pine)")}${mbar(x.tot.f, st.f, "F", "var(--iron)")}${mbar(x.tot.c, st.c, "C", "var(--heat)")}</div>` : `<div class="small muted">${x.date > t ? "Nothing logged yet" : "No food logged"}</div>`}
        </div>
        <div class="dck">${x.logged ? `<b>${x.tot.k.toLocaleString()}</b><span>cal</span>` : `<span class="muted">—</span>`}</div>
      </div></summary>
      <div class="dbody small">

        ${wl ? `<p><b>Workout:</b> ${stt.sets} sets${stt.vol ? `, ${stt.vol.toLocaleString()} lb lifted` : ""}${stt.min ? `, ${stt.min} minutes` : ""}. <button class="linkbtn" data-action="openlog" data-date="${x.date}">View</button></p>` : ""}
        ${kept !== null ? `<p><b>Fasting:</b> ${kept ? "window kept" : "window ran long"} (${esc(fmtMin(toMin(x.d.eatStart)))} to ${esc(fmtMin(toMin(x.d.eatEnd)))}).</p>` : ""}
        ${meals ? `<ul class="plain">${meals}</ul>` : ""}
        ${x.logged ? `<p class="muted">${x.tot.k.toLocaleString()} cal, ${x.tot.p} g protein, ${x.tot.f} g fat, ${x.tot.c} g carbs.</p>` : ""}

  // Nutrition table
  const cell = (v, target, kind) => { if (v == null) return `<td class="muted">—</td>`; const hit = kind === "k" ? Math.abs(v - target) / target <= 0.1 : kind === "p" ? v >= target - 10 : v <= target * 1.15; return `<td class="${hit ? "hit" : ""}">${v.toLocaleString()}</td>`; };
  const rows = info.map(x => `<tr><th scope="row">${DAYNAMES[parseDs(x.date).getDay()].slice(0, 3)}</th>${x.logged ? cell(x.tot.k, st.kcal, "k") + cell(x.tot.p, st.p, "p") + cell(x.tot.f, st.f, "f") + cell(x.tot.c, st.c, "c") : `<td class="muted">—</td><td class="muted">—</td><td class="muted">—</td><td class="muted">—</td>`}</tr>`).join("");
  const av = k => logged.length ? Math.round(logged.reduce((a, x) => a + x.tot[k], 0) / logged.length).toLocaleString() : "—";
  const table = `<section class="panel"><h3>Nutrition this week</h3><div class="scroll"><table class="ntable"><thead><tr><th></th><th>Calories</th><th>Protein</th><th>Fat</th><th>Carbs</th></tr></thead>
    <tbody>${rows}</tbody><tfoot><tr><th scope="row">Average</th><td>${av("k")}</td><td>${av("p")}</td><td>${av("f")}</td><td>${av("c")}</td></tr>
    <tr class="muted"><th scope="row">Target</th><td>${st.kcal.toLocaleString()}</td><td>${st.p}</td><td>${st.f}</td><td>${st.c}</td></tr></tfoot></table></div>
    <p class="small muted" style="margin:8px 0 0">Green means on target: calories within 10%, protein within 10 g, fat and carbs not more than 15% over. Averages count only days you logged food.</p></section>`;

  return weekNav(ws) + strip + tiles + `<h2>Day by day</h2><section class="panel daylist">${cards}</section>` + table;
}

/* ---------- Train ---------- */

    ? `<h3 style="margin:12px 0 4px">${esc(part.title)}</h3><ul>${WARMUP.map(w => `<li>${esc(w)}</li>`).join("")}</ul>`

      return `<div class="ex"><div class="exn">${esc(it.name)}</div><div class="rx">${esc(it.rx)}</div>${it.note ? `<div class="small muted">${esc(it.note)}</div>` : ""}</div>`; }).join("")).join("");
}

/* ---------- Eat ---------- */
function weekMenuNeeds(ws) {
  const w = weekObj(ws), tot = {};
  Object.entries(w.menu).forEach(([id, n]) => { const r = R(id); if (r && n > 0) r.ing.forEach(([i, a]) => { tot[i] = (tot[i] || 0) + a * n; }); });
  return tot;
}
function recipeRow(id, extra) {

  return `<div class="rrow"><button class="linkbtn rname" data-action="recipe" data-id="${id}"><b>${esc(r.name)}</b>${isFav(id) ? ` <span class="star">★</span>` : ""}<span class="small muted">${esc(flavName(r))}, ${r.kcal} cal, ${r.p} g protein</span></button>
    ${extra || `<button class="btn sm ${inMenu ? "done" : ""}" data-action="menuadd" data-id="${id}" aria-label="Add ${esc(r.name)} to this week’s menu">${inMenu ? `Menu ×${inMenu}` : "+ Menu"}</button>`}</div>`;
}
function browserList() {
  const q = RB.q.trim().toLowerCase();
  let ids = allIds().filter(id => {
    const r = R(id); if (!r) return false;
    if (RB.hidden ? !isHidden(id) : isHidden(id)) return false;
    if (RB.kind !== "all" && kindOf(r) !== RB.kind) return false;
    if (RB.flav === "mine" ? !r.mine : RB.flav !== "all" && r.flavor !== RB.flav) return false;
    if (RB.fav && !isFav(id)) return false;
    if (!RB.hidden && !matches(id)) return false;
    if (q && !q.split(/\s+/).every(w => searchText(r).includes(w.replace(/s$/, "")))) return false;
    return true;
  });
  ids.sort((a, b) => (isFav(b) - isFav(a)) || R(a).name.localeCompare(R(b).name));
  if (!ids.length) return `<p class="small muted">${RB.hidden ? "No hidden recipes." : "Nothing matches. Try clearing the search or filters."}</p>`;
  return `<p class="small muted" style="margin:0 0 4px">${ids.length} recipe${ids.length === 1 ? "" : "s"}</p>` + ids.map(id => recipeRow(id, RB.hidden ? `<button class="btn sm" data-action="rate" data-id="${id}" data-val="0">Unhide</button>` : "")).join("");
}
function vEat() {

  const needMeals = { first: 7, main: 14, snack: 14 };

    <p class="small muted" style="margin:4px 0 8px">How many times you’ll eat each meal. Your grocery list and prep come from this. Pick days for them below, or decide the day of.</p>

  if (eggsBoil) prepItems.push(`Hard-boil ${eggsBoil} eggs.`);
  entries.filter(([id]) => R(id).batch).forEach(([id]) => prepItems.push(R(id).batch));
  const prep = entries.length ? `<h2>Sunday prep</h2><section class="panel"><ol class="steps" style="margin:0">${["Shop using the list below.", ...prepItems, "Everything else cooks the night you eat it, in 20–30 minutes."].map(p => `<li>${esc(p)}</li>`).join("")}</ol></section>` : "";

  const ids = Object.keys(need).filter(id => need[id] > 0);
  let checkout = 0, eaten = 0;
  ids.forEach(id => { const g = ING[id], pr = priceOf(id); eaten += need[id] * pr / g.pkg; if (!g.pantry) checkout += Math.max(1, Math.ceil(need[id] / g.pkg - 0.1)) * pr; });
  const grow = id => { const g = ING[id], got = !!(S.groc2[id] && S.groc2[id].got), n = Math.max(1, Math.ceil(need[id] / g.pkg - 0.1));
    return `<div class="gitem"><button class="check" aria-pressed="${got}" aria-label="Got ${esc(g.name)}" data-action="got" data-id="${id}"></button>
      <div class="gname ${got ? "got" : ""}">${g.pantry ? "" : `${n} × `}${esc(g.name)}<span class="small muted" style="display:block">${esc(g.pkgName)}. Need ${esc(ingLine(id, need[id]))}.</span></div>
      <label class="sr" for="p-${id}">Price for ${esc(g.name)}</label><input type="number" id="p-${id}" inputmode="decimal" step="0.01" min="0" value="${priceOf(id).toFixed(2)}" data-price="${id}"></div>`; };
  const GORDER = [["protein", "Protein"], ["dairy", "Eggs and dairy"], ["carb", "Bread, pasta and beans"], ["veg", "Produce and frozen vegetables"], ["pantry", "Sauces, broth and cans"]];
  const groc = entries.length ? `<h2>Walmart list</h2><section class="panel">
    <div class="tot" style="grid-template-columns:repeat(3,1fr);margin-top:0"><div><b>${money(eaten)}</b><span>food you’ll eat</span></div><div><b>${money(checkout)}</b><span>at checkout</span></div><div><b>${money(st.budget)}</b><span>your budget</span></div></div>
    <p class="small muted" style="margin:10px 0">Built from this week’s menu. Checkout is whole packages, so it runs higher some weeks; leftovers carry over. Tap a price to change it.</p>
    ${GORDER.map(([g, label]) => { const list = ids.filter(id => ING[id].g === g && !ING[id].pantry); return list.length ? `<h3 class="sub3">${label}</h3>` + list.map(grow).join("") : ""; }).join("")}
    ${ids.some(id => ING[id].pantry) ? `<h3 class="sub3">Pantry staples</h3><p class="small muted" style="margin:0 0 4px">These last several weeks, so they’re not in the checkout total.</p>` + ids.filter(id => ING[id].pantry).map(grow).join("") : ""}
    <div class="row" style="margin-top:12px"><button class="btn sm" data-action="clearlist">Uncheck everything for a new week</button></div></section>` : "";

  const rules = `<h2>Eating out or eating with the family</h2><section class="panel small">
    <p>Build the plate by hand: 2 palms of protein, 1–2 cupped hands of carbs, 2 fists of vegetables, 1 thumb of fat. Log it with “Family plate” or “Eating out” on the Today tab.</p>
    <p style="margin:0">Always ask about shellfish in sauces, stocks and shared fryers. Puerto Rican restaurants often cook with shrimp, so ask about the sofrito and rice too.</p></section>`;
  return weekNav(ws) + menu + days + browser + prep + groc + rules;
}

function vProgress() {
  const t = today();
  const days = allDays().filter(([, v]) => v.w);
  const start = addDays(t, -55);
  const pts = days.filter(([d]) => d >= start);
  let chart;
  if (pts.length < 2) {
    chart = `<p class="muted">Log your morning weight on the Today tab. Your trend line appears after a few days.</p>`;
  } else {
    const W = 340, H = 170, L = 34, R = 8, T = 10, B = 22;
    const ws = pts.map(([, v]) => +v.w);
    const lo = Math.floor(Math.min(...ws) - 1), hi = Math.ceil(Math.max(...ws) + 1);
    const t0 = parseDs(pts[0][0]).getTime(), t1 = Math.max(parseDs(pts[pts.length - 1][0]).getTime(), t0 + 86400000);
    const x = d => L + (parseDs(d).getTime() - t0) / (t1 - t0) * (W - L - R);
    const y = w => T + (hi - w) / (hi - lo) * (H - T - B);
    const avgPts = pts.map(([d]) => { const a = avgWeight(d); return a ? `${x(d).toFixed(1)},${y(a.avg).toFixed(1)}` : null; }).filter(Boolean).join(" ");
    const grid = [lo, (lo + hi) / 2, hi].map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 4}" y="${y(v) + 4}" text-anchor="end">${Math.round(v)}</text>`).join("");
    chart = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend over the last 8 weeks">${grid}
      ${pts.map(([d, v]) => `<circle class="dot" cx="${x(d).toFixed(1)}" cy="${y(+v.w).toFixed(1)}" r="2.6"/>`).join("")}
      <polyline class="avg" points="${avgPts}"/>
      <text x="${L}" y="${H - 4}">${fmtDate(pts[0][0])}</text><text x="${W - R}" y="${H - 4}" text-anchor="end">${fmtDate(pts[pts.length - 1][0])}</text></svg>
      <p class="small muted" style="margin:6px 0 0">Dots are daily weigh-ins. The line is your 7-day average, the number that matters. Heat sessions and salty meals move the dots; ignore them.</p>`;
  }

  // Weekly review
  const a1 = avgWeight(t), a0 = avgWeight(addDays(t, -7)), am1 = avgWeight(addDays(t, -14));
  let review;
  if (!a1 || !a0 || a1.n < 3 || a0.n < 3) {
    review = `<p class="muted">Weigh in at least 3 mornings a week for two weeks to unlock your weekly review.</p>`;
  } else {
    const delta = a1.avg - a0.avg, prev = am1 && am1.n >= 3 ? a0.avg - am1.avg : null;
    const ms = S.measures.slice().sort((p, q) => p.d < q.d ? -1 : 1);
    const waistDown = ms.length >= 2 && (ms[ms.length - 2].waist - ms[ms.length - 1].waist) >= 0.5;
    let msg, act = "";
    if (delta <= -1.75) { msg = `Down ${Math.abs(round1(delta))} lb this week, faster than planned. Losing this fast risks muscle.`; act = `<button class="btn sm heat" data-action="adjust" data-val="150">Add 150 calories (to ${(S.settings.kcal + 150).toLocaleString()})</button>`; }
    else if (delta <= -0.4) { msg = `Down ${Math.abs(round1(delta))} lb this week. Right on track. Change nothing.`; }
    else if (waistDown) { msg = `Weight is flat but your waist is down. That’s recomposition: losing fat while gaining muscle. Hold steady.`; }
    else if (prev != null && prev > -0.4) { msg = `Two flat weeks in a row. Time for a small change.`; act = `<button class="btn sm heat" data-action="adjust" data-val="-150">Drop 150 calories (to ${(S.settings.kcal - 150).toLocaleString()})</button>`; }
    else { msg = `Flat this week (${delta > 0 ? "+" : ""}${round1(delta)} lb). One flat week is usually water from heat, salt, or poor sleep. Hold steady and check next week.`; }
    review = `<p>${msg}</p>${act}`;
  }

  // Measurements
  const h = S.settings.heightIn;
  const ms = S.measures.slice().sort((p, q) => p.d < q.d ? 1 : -1);
  const latest = ms[0];
  const lbf = latest ? navyBf(latest.waist, latest.neck, h) : null;
  const lw = latest ? (latest.w || (avgWeight(latest.d) || {}).avg) : null;
  const meas = `<section class="panel"><h3>Body fat estimate</h3>
    <p class="small muted">Every 2 weeks, same time of day. Tape around your waist at the belly button, relaxed, and around your neck just below the Adam’s apple. This uses the U.S. Navy formula: not perfect, but consistent, which is what matters.</p>
    <div class="field"><label for="m-waist">Waist, inches</label><input type="number" id="m-waist" inputmode="decimal" step="0.25"></div>
    <div class="field"><label for="m-neck">Neck, inches</label><input type="number" id="m-neck" inputmode="decimal" step="0.25"></div>
    <div class="row" style="margin:8px 0 12px"><button class="btn sm primary" data-action="addmeasure">Save measurement</button></div>
    ${lbf != null ? `<p><span class="big">${round1(lbf)}%</span> <span class="muted">estimated body fat, goal ${S.settings.goalBf}%${lw ? `. About ${Math.round(lw * (1 - lbf / 100))} lb lean mass` : ""}.</span></p>` : ""}
    ${ms.length ? `<div class="scroll"><table><thead><tr><th>Date</th><th>Waist</th><th>Neck</th><th>Body fat</th><th></th></tr></thead><tbody>${ms.map(m => { const bf = navyBf(m.waist, m.neck, h); return `<tr><td>${fmtDate(m.d)}</td><td>${m.waist}"</td><td>${m.neck}"</td><td>${bf != null ? round1(bf) + "%" : "—"}</td><td><button class="btn sm ghost" data-action="delmeasure" data-d="${m.d}" aria-label="Delete measurement from ${fmtDate(m.d)}">×</button></td></tr>`; }).join("")}</tbody></table></div>` : ""}
  </section>`;

  const tests = S.tests.slice().sort((p, q) => p.d < q.d ? 1 : -1);
  const testsPanel = `<section class="panel"><h3>Fitness check, every 6 weeks</h3>
    <p class="small muted">Do these fresh, at the start of a session.</p>
    <div class="field"><label for="t-pu">Push-ups<span class="sub">Max with good form</span></label><input type="number" id="t-pu" inputmode="numeric"></div>
    <div class="field"><label for="t-pl">Plank<span class="sub">Seconds</span></label><input type="number" id="t-pl" inputmode="numeric"></div>
    <div class="field"><label for="t-sq">Deep squat hold<span class="sub">Seconds, heels down</span></label><input type="number" id="t-sq" inputmode="numeric"></div>
    <div class="field"><label for="t-sr">Toe touch<span class="sub">Inches past toes (negative if short)</span></label><input type="number" id="t-sr" inputmode="decimal" step="0.5"></div>
    <div class="row" style="margin:8px 0"><button class="btn sm primary" data-action="addtest">Save results</button></div>
    ${tests.length ? `<div class="scroll"><table><thead><tr><th>Date</th><th>Push-ups</th><th>Plank</th><th>Squat</th><th>Toe touch</th></tr></thead><tbody>${tests.map(x => `<tr><td>${fmtDate(x.d)}</td><td>${x.pu ?? "—"}</td><td>${x.pl != null ? x.pl + "s" : "—"}</td><td>${x.sq != null ? x.sq + "s" : "—"}</td><td>${x.sr != null ? x.sr + '"' : "—"}</td></tr>`).join("")}</tbody></table></div>` : ""}
  </section>`;

  return `<h2>Weight trend</h2><section class="panel">${chart}</section>
    <h2>Weekly review</h2><section class="panel">${review}<p class="small muted" style="margin:10px 0 0">For workouts and nutrition day by day, see the <a href="#week">Week</a> tab.</p></section>
    <h2>Measurements</h2>${meas}${testsPanel}`;
}

    <h2>Recipe feedback</h2><section class="panel small">
      ${(() => { const fav = allIds().filter(isFav), hid = allIds().filter(isHidden), mine = Object.keys(S.myRecipes || {});
        const ls = arr => arr.length ? arr.map(id => esc(R(id).short || R(id).name)).join(", ") : "none yet";

function ovShell(title, body, foot, sub) {
  return `<div class="ovhead"><button class="btn sm ghost" data-action="close">${OV && OV.back ? "‹ Back" : "Close"}</button><div class="ovt"><h2>${esc(title)}</h2>${sub ? `<span class="small muted">${sub}</span>` : ""}</div></div>

}
function macroTiles(m) {
  return `<div class="tot"><div><b>${m.kcal.toLocaleString()}</b><span>calories</span></div><div><b>${m.p} g</b><span>protein</span></div><div><b>${m.f} g</b><span>fat</span></div><div><b>${m.c} g</b><span>carbs</span></div></div>`;
}
function vOverlay() {
  const o = OV;
  if (o.t === "recipe") {

      <h3 class="sub3">Ingredients</h3><ul>${r.ing.map(([id, a]) => `<li>${esc(ingLine(id, a))}</li>`).join("")}</ul>
      <h3 class="sub3">Steps</h3><ol class="steps">${r.steps.map(x => `<li>${esc(x)}</li>`).join("")}</ol>
      ${r.batch ? `<p class="small muted">${esc(r.batch)} Leftovers cover other days or go in the freezer.</p>` : ""}
      ${r.family ? `<p class="small muted">${esc(r.family)}</p>` : ""}
      <div class="row" style="margin-top:14px">

        <button class="btn sm ghost" data-action="rate" data-id="${o.id}" data-val="${isHidden(o.id) ? 0 : -1}">${isHidden(o.id) ? "Unhide" : "Not for me"}</button>
        ${r.mine ? `<button class="btn sm ghost" data-action="delmine" data-id="${o.id}">Delete recipe</button>` : ""}</div>`,
      `<button class="btn primary" data-action="menuadd" data-id="${o.id}">${n ? `On this week’s menu ×${n}. Add one more` : "Add to this week’s menu"}</button>`);
  }
  if (o.t === "choose") {

    const mine = Object.entries(w.menu).filter(([id, n]) => R(id) && n > 0 && kindOf(R(id)) === k);
    const menuList = mine.length ? mine.map(([id, n]) => { const r = R(id), left = n - (used[id] || 0);

      : `<p class="small muted">Nothing on this week’s menu for this slot yet. Pick from all recipes below; it’ll be added to your menu.</p>`;
    return ovShell(`Choose ${SLOTNAME[o.slot].toLowerCase()}`, `
      <h3 class="sub3">From your menu</h3>${menuList}
      <h3 class="sub3">All recipes</h3><label class="sr" for="ch-q">Search recipes</label><input type="search" id="ch-q" class="search" placeholder="Search" value="${esc(o.q || "")}" data-search="ch">
      <div id="ch-list">${chooserList()}</div>
      <div class="row" style="margin-top:12px"><button class="btn sm" data-action="build">Build a meal from what you have</button>${cur ? `<button class="btn sm ghost" data-action="clearslot">Clear this slot</button>` : ""}</div>`,
      "", `${DAYNAMES[parseDs(o.date).getDay()]}, ${fmtDate(o.date)}`);
  }
  if (o.t === "sess") {

    const row = sid => { const m = sessMeta(sid), k = KIND[m.kind];

    return ovShell("Choose a session", `<h3 class="sub3">Your program</h3>${["A", "B", "C", "D", "E", "R", "H"].map(row).join("")}${row("rest")}
      <h3 class="sub3">A single Hotworx session</h3><div class="chips">${HX.map(n => `<button class="chip" aria-pressed="${cur === "hx:" + n}" data-action="setsess" data-date="${o.date}" data-sid="hx:${n}">${esc(n)}</button>`).join("")}</div>`,

function vBuilder() {

/* ----- Workout logger ----- */
function fmtClock(sec) { sec = Math.max(0, Math.round(sec)); return `${Math.floor(sec / 60)}:${pad(sec % 60)}`; }
function vLogger() {

    let hint = "";

    }

    ? `<button class="btn primary" data-action="close">Close</button><button class="btn ghost" data-action="discardlog">Delete workout</button>`

  return ovShell(s ? s.name : "Workout", `<p class="small muted">Tap ✓ as you finish each set. Leave a box empty and it uses last time’s number (shown in gray). The rest timer starts on its own.</p>${body}`, foot, sub);
}
function tick() {

setInterval(tick, 1000);

    case "flav": { const k = b.dataset.id; S.plan.flav[k] = S.plan.flav[k] === false; saveLocal(); render(); break; }
    case "got": { const id = b.dataset.id; S.groc2[id] = { ...(S.groc2[id] || {}), got: !(S.groc2[id] && S.groc2[id].got) }; saveLocal(); render(); break; }
    case "clearlist": Object.keys(S.groc2).forEach(id => { S.groc2[id] = { ...S.groc2[id], got: false }; }); saveLocal(); render(); break;
    case "copyfeedback": {
      const names = f => allIds().filter(f).map(id => R(id).name);
      const txt = `Recipe feedback from my Summit app\nFavorites: ${names(isFav).join("; ") || "none"}\nNot for me: ${names(isHidden).join("; ") || "none"}\nMy own recipes: ${Object.values(S.myRecipes).map(r => `${r.name} (${r.ing.map(([i, a]) => ingLine(i, a)).join(", ")})`).join("; ") || "none"}`;
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => { toast("Copied. Paste it into your chat with Claude."); render(); }).catch(() => window.prompt("Copy this:", txt));
      break;
    }

    /* builder */
    case "build": OV = { t: "build", items: {}, slot: OV && OV.t === "choose" ? (slotKind(OV.slot)) : "main", name: "", back: OV }; render(); break;
    case "bslot": OV.slot = b.dataset.val; render(); break;
    case "badd": { const id = b.dataset.id; if (OV.items[id] > 0) delete OV.items[id]; else OV.items[id] = defAmt(id); render(); break; }
    case "bstep": { const id = b.dataset.id, n = Math.round(((OV.items[id] || 0) + +b.dataset.val * stepOf(id)) * 100) / 100; if (n <= 0) delete OV.items[id]; else OV.items[id] = n; render(); break; }
    case "bsave": {
      const entries = Object.entries(OV.items).filter(([, x]) => x > 0); if (!entries.length) return;
      const nameEl = $("#b-name"), name = ((nameEl && nameEl.value) || buildName(OV.items)).trim().slice(0, 70);
      const { flav } = buildStyle(OV.items), id = "my" + Date.now().toString(36);
      const r = { name, short: name.length > 24 ? name.slice(0, 22) + "…" : name, slots: OV.slot === "main" ? ["lunch", "dinner"] : [OV.slot], flavor: ["pr", "italian"].includes(flav) ? flav : flav === "bbq" ? "american" : "any",
        ing: entries, steps: buildSteps(OV.items), family: "", mine: true, ...macrosOf(entries) };
      S.myRecipes[id] = r;
      const back = OV.back;
      if (b.dataset.val === "menu") {
        if (back && back.t === "choose") { assignSlot(back.date, back.slot, id); OV = back.back || null; toast(`Saved and added for ${SLOTNAME[back.slot].toLowerCase()}`); }
        else { const w = weekObj(curWs(), true); w.menu[id] = (w.menu[id] || 0) + 1; OV = back || null; toast("Saved and added to this week’s menu"); }
      } else { OV = back || null; toast("Saved to your recipes"); }
      saveLocal(); render(); break;
    }

    /* settings, measurements, backups */
    case "adjust": { const v = +b.dataset.val; S.settings.kcal += v; S.settings.c = Math.max(100, S.settings.c + Math.round(v / 4)); saveLocal(); render(); break; }
    case "addmeasure": {
      const waist = parseFloat($("#m-waist").value), neck = parseFloat($("#m-neck").value);
      if (!(waist > 20 && neck > 10)) { alert("Enter both waist and neck in inches."); return; }
      const w = getDay(t).w || null;
      S.measures = S.measures.filter(m => m.d !== t).concat([{ d: t, waist, neck, w }]);
      saveLocal(); render(); break;
    }
    case "delmeasure": S.measures = S.measures.filter(m => m.d !== b.dataset.d); saveLocal(); render(); break;
    case "addtest": {
      const val = id => { const v = $(id).value; return v === "" ? null : +v; };
      const rec = { d: t, pu: val("#t-pu"), pl: val("#t-pl"), sq: val("#t-sq"), sr: val("#t-sr") };
      if ([rec.pu, rec.pl, rec.sq, rec.sr].every(v => v == null)) return;
      S.tests = S.tests.filter(x => x.d !== t).concat([rec]); saveLocal(); render(); break;
    }
    case "savesettings": {
      const n = (id, k) => { const v = parseFloat($(id).value); if (!isNaN(v) && v > 0) S.settings[k] = v; };
      n("#s-kcal", "kcal"); n("#s-p", "p"); n("#s-f", "f"); n("#s-c", "c"); n("#s-budget", "budget"); n("#s-height", "heightIn"); n("#s-goal", "goalBf");
      const ce = $("#s-crunch").value; if (ce) S.settings.crunchEnd = ce;
      S.settings.phase = $("#s-phase").value;
      const fv = +$("#s-fast").value; S.settings.fastOn = fv > 0; if (fv > 0) S.settings.fastHours = fv;
      const op = $("#s-open").value;
      if (op) { if (toMin(op) + (S.settings.fastHours || 8) * 60 <= 1440) S.settings.fastOpen = op; else alert("Your eating window has to close by midnight. Pick an earlier opening time."); }
      saveLocal(); render();
      b.textContent = "Saved"; break;
    }
    case "export": {
      const name = `summit-backup-${t}.json`;
      const file = new File([JSON.stringify(S, null, 2)], name, { type: "application/json" });
      S.settings.lastBackup = t; saveLocal();
      if (navigator.canShare && navigator.canShare({ files: [file] })) navigator.share({ files: [file], title: "Summit backup" }).catch(() => {});
      else { const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
      render(); break;
    }
    case "restore": { const f = document.getElementById("restore-file"); if (f) f.click(); break; }
  }
});

document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.search === "rb") { RB.q = el.value; const l = $("#rb-list"); if (l) l.innerHTML = browserList(); }
  else if (el.dataset.search === "ch" && OV) { OV.q = el.value; const l = $("#ch-list"); if (l) l.innerHTML = chooserList(); }
});

document.addEventListener("change", e => {
  const el = e.target, t = today();
  if (el.id === "restore-file") {
    const f = el.files && el.files[0]; if (!f) return;
    f.text().then(txt => {
      const o = JSON.parse(txt);
      if (!o || typeof o !== "object" || !(o.settings || o.logs)) throw new Error("bad");
      if (!confirm("Replace the data on this phone with this backup?")) return;
      S = { ...o, settings: normSettings(o.settings) }; migrate();
      saveLocal(); render(); alert("Backup restored.");
    }).catch(() => alert("That file isn’t a Summit backup. Choose the .json file you saved from this app."));
    el.value = ""; return;
  }
  if (el.dataset.field === "w") { const v = parseFloat(el.value), dt = el.dataset.date || t; setDay(dt, { w: isNaN(v) ? null : round1(v) }); pendingRender = true; }
  else if (el.dataset.ftime) { setDay(t, { [el.dataset.ftime]: el.value || null }); pendingRender = true; }
  else if (el.dataset.price) { const v = parseFloat(el.value), id = el.dataset.price; S.groc2[id] = { ...(S.groc2[id] || {}), price: isNaN(v) ? null : v }; saveLocal(); pendingRender = true; }
  else if (el.dataset.bname && OV && OV.t === "build") { OV.name = el.value; }
  else if (el.dataset.ls && OV && OV.t === "log") {
    const [id, i, k] = el.dataset.ls.split("|"), d = getDay(OV.date), wl = { ...d.wlog, ex: { ...(d.wlog.ex || {}) } }, arr = (wl.ex[id] || []).slice();
    arr[+i] = { ...(arr[+i] || {}), [k]: el.value }; wl.ex[id] = arr; setDay(OV.date, { wlog: wl });
  }
});

document.addEventListener("toggle", e => {
  const d = e.target;
  if (d.tagName === "DETAILS" && d.dataset.key) { if (d.open) openSet.add(d.dataset.key); else openSet.delete(d.dataset.key); }
}, true);

/* ---------------- Routing and start-up ---------------- */
const VALID = TABS.map(x => x[0]).concat(["more"]);
function fromHash() { const h = location.hash.slice(1); if (VALID.includes(h)) { tab = h; OV = null; } else if (!h) tab = "today"; render(); if (VALID.includes(h)) window.scrollTo(0, 0); }
window.addEventListener("hashchange", fromHash);
migrate();
fromHash();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

</script>
</body>
